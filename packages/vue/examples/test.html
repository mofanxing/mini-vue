<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <div id="app"></div>
    <script src="../dist/vue.js"></script>
    <script>
        const { reactive, effect } = Vue
        const p = reactive({
            name: '张三',
            age: 19
        })
        effect(() => {
            document.querySelector('#app').innerText = p.name
        })
    </script>

</body>

</html>
