<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <div id="app">
        <p class="p1"></p>
        <p class="p2"></p>
    </div>
    <script src="../dist/vue.js"></script>
    <script>
        const { ref, effect } = Vue
        const p = ref({
            name: '张三',
            age: 19
        })
       
        effect(() => {
            document.querySelector('#app .p1').innerText = p.value.name
        })
        effect(() => {
            document.querySelector('#app .p2').innerText = p.value.name
        })
        setTimeout(() => {
            p.value.name = '李四'
        }, 2000);
    </script>

</body>

</html>
